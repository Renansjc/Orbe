[package]
name = "orbe-app"
version = "0.1.0"
description = "Orbe: controle residencial local na bandeja do Windows"
edition = "2021"

[lib]
name = "orbe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mt01-matter-probe = { path = ".." }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
